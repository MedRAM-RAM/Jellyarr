name: Build cloudflared for Android
description: >
  Builds cloudflared (linux/arm64, static) with the Jellyarr DNS patch (ci/cloudflared) and puts it in the
  app assets, so the app can run the Cloudflare Tunnel itself.

inputs:
  tag:
    description: cloudflared release tag to build
    default: '2026.11.2'

runs:
  using: composite
  steps:
    - name: Fetch cloudflared source
      shell: bash
      run: git clone --depth 1 --branch "${{ inputs.tag }}" https://github.com/cloudflare/cloudflared "$RUNNER_TEMP/cloudflared-src"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ runner.temp }}/cloudflared-src/go.mod
        cache: false

    - name: Build and check cloudflared
      shell: bash
      run: |
        set -euo pipefail
        SRC="$RUNNER_TEMP/cloudflared-src"
        cp "$GITHUB_WORKSPACE/ci/cloudflared/jellyarr_android_dns.go" "$SRC/cmd/cloudflared/"
        cd "$SRC"
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
          -ldflags "-s -w -X main.Version=${{ inputs.tag }}" -o "$RUNNER_TEMP/cloudflared" ./cmd/cloudflared
        file "$RUNNER_TEMP/cloudflared"
        # Sanity run under emulation: plain, and with the DNS patch switched on (the init path must not crash).
        # The package name differs between runner images, and this check must never block the APK build.
        sudo apt-get update -qq || true
        if sudo apt-get install -y -qq qemu-user-static || sudo apt-get install -y -qq qemu-user; then
          QEMU="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
          "$QEMU" "$RUNNER_TEMP/cloudflared" --version
          JELLYARR_DNS="127.0.0.1:1,1.1.1.1" "$QEMU" "$RUNNER_TEMP/cloudflared" --version
        else
          echo "::warning::No qemu package on this runner: skipped the emulated run of cloudflared (build and ELF check passed)"
        fi
        mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
        cp "$RUNNER_TEMP/cloudflared" "$GITHUB_WORKSPACE/app/src/main/assets/cloudflared-android-arm64"
        ls -la "$GITHUB_WORKSPACE/app/src/main/assets/cloudflared-android-arm64"
        sha256sum "$GITHUB_WORKSPACE/app/src/main/assets/cloudflared-android-arm64"
